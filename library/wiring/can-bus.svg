" stroke="#4d5d6a" stroke-width="4"/><rect x="1068" y="396" width="24" height="45" rx="0" fill="#fff" stroke="#4d5d6a"/><path d="M 1080 441 L 1080 471" fill="none" stroke="#4d5d6a" stroke-width="4"/><text x="1080" y="513" font-size="19" fill="#17222e" font-weight="600" text-anchor="middle">120 ohm</text><text x="420" y="350" font-size="24" fill="#007c83" font-weight="700" text-anchor="middle">CANH</text><text x="600" y="507" font-size="24" fill="#946500" font-weight="700" text-anchor="middle">CANL</text><text x="50" y="576" font-size="22" fill="#4d5d6a" font-weight="400" text-anchor="start">MCU CAN TX/RX connects through each transceiver. No GPIO connects directly to CANH/CANL.</text><text x="50" y="676" font-size="21" fill="#4d5d6a" font-weight="400" text-anchor="start">Signal reference / isolation and power are not drawn. Design them for the actual ground</text><text x="50" y="705" font-size="21" fill="#4d5d6a" font-weight="400" text-anchor="start">offsets and transceiver limits.</text><text x="50" y="761" font-size="19" fill="#4d5d6a" font-weight="400" text-anchor="start">Dot = electrical connection. Crossing lines without a dot are not connected.</text><path d="M 50 819 L 1150 819" fill="none" stroke="#d2dae1" stroke-width="2"/><text x="50" y="853" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">Conventional high-speed two-wire CAN. This is not a low-speed fault-tolerant, single-wire, OBD connector</text><text x="50" y="879" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">or automotive harness pinout.</text><text x="50" y="913" font-size="17" fill="#4d5d6a" font-weight="400" text-anchor="start">Original Black Wire connection diagram. Documentation reviewed; not independently bench-tested.</text><text x="50" y="960" font-size="16" fill="#b82736" font-weight="600" text-anchor="start">Kal / Valleytech Solutions  |  CC BY 4.0  |  can-bus  |  2026-09-27</text><text x="50" y="987" font-size="15" fill="#4d5d6a" font-weight="400" 
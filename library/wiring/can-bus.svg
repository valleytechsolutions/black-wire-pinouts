<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1016" viewBox="0 0 1200 1016" role="img" aria-labelledby="title desc"><title id="title">CAN bus: controller, transceiver and termination</title><desc id="desc">Conventional high-speed two-wire CAN. This is not a low-speed fault-tolerant, single-wire, OBD connector or automotive harness pinout.</desc><metadata>{&quot;creator&quot;: &quot;Kal / Valleytech Solutions&quot;, &quot;license&quot;: &quot;https://creativecommons.org/licenses/by/4.0/&quot;, &quot;sources&quot;: [{&quot;title&quot;: &quot;Texas Instruments: CAN physical layer, SLLA270&quot;, &quot;url&quot;: &quot;https://www.ti.com/lit/an/slla270/slla270.pdf&quot;, &quot;locator&quot;: &quot;Figures 6, 8 and 9: transceivers and end termination; connector scope&quot;, &quot;checked&quot;: &quot;2026-09-27&quot;, &quot;sha256&quot;: &quot;10c315a683fa60954ba005d3392097a2e30cddcbf1eef10119a70d592b54ca81&quot;, &quot;bytes&quot;: 417948, &quot;format&quot;: &quot;PDF&quot;, &quot;verification&quot;: &quot;Publisher content inspected&quot;}], &quot;review&quot;: &quot;Source documents inspected; independent electrical and bench review pending&quot;}</metadata><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="1016" fill="#fff"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#b82736" stroke="#b82736"/><text x="50" y="59" font-size="18" fill="#b82736" font-weight="700" text-anchor="start">BLACK WIRE / WIRING &amp; PROTOCOLS</text><text x="50" y="110" font-size="33" fill="#17222e" font-weight="700" text-anchor="start">Two cable ends, two terminators</text><text x="50" y="148" font-size="20" fill="#4d5d6a" font-weight="400" text-anchor="start">120-ohm termination across CANH/CANL at each end of a 120-ohm bus.</text><path d="M 120 366 L 1080 366" fill="none" stroke="#007c83" stroke-width="4"/><path d="M 120 471 L 1080 471" fill="none" stroke="#946500" stroke-width="4"/><rect x="180" y="211" width="210" height="100" rx="12" fill=
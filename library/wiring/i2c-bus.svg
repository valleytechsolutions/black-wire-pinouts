<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="997" viewBox="0 0 1200 997" role="img" aria-labelledby="title desc"><title id="title">I2C: two shared lines with pull-ups</title><desc id="desc">Ordinary open-drain I2C. Connector-branded systems still require their own pinout and voltage check.</desc><metadata>{&quot;creator&quot;: &quot;Kal / Valleytech Solutions&quot;, &quot;license&quot;: &quot;https://creativecommons.org/licenses/by/4.0/&quot;, &quot;sources&quot;: [{&quot;title&quot;: &quot;NXP: I2C specification, UM10204&quot;, &quot;url&quot;: &quot;https://www.nxp.com/docs/en/user-guide/UM10204.pdf&quot;, &quot;locator&quot;: &quot;SDA/SCL, open-drain bus, addressing and pull-up sizing&quot;, &quot;checked&quot;: &quot;2026-09-27&quot;, &quot;sha256&quot;: &quot;dc91f00f65584e06ef36e26c93bf9d91a95fb3c8a1830a9223e53caf678b36af&quot;, &quot;bytes&quot;: 750958, &quot;format&quot;: &quot;PDF&quot;, &quot;verification&quot;: &quot;Publisher content inspected&quot;}], &quot;review&quot;: &quot;Source documents inspected; independent electrical and bench review pending&quot;}</metadata><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="997" fill="#fff"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#b82736" stroke="#b82736"/><text x="50" y="59" font-size="18" fill="#b82736" font-weight="700" text-anchor="start">BLACK WIRE / WIRING &amp; PROTOCOLS</text><text x="50" y="110" font-size="33" fill="#17222e" font-weight="700" text-anchor="start">Pull up to a compatible logic rail</text><text x="50" y="148" font-size="20" fill="#4d5d6a" font-weight="400" text-anchor="start">Each line needs an effective pull-up. Existing module resistors combine in parallel.</text><path d="M 100 246 L 1100 246" fill="none" stroke="#b82736" stroke-width="4"/><text x="600" y="228" font-size="23" fill="#b82736" font-weight="700" text-anchor="middle">Compatible logic rail</text><path d="M 450 246 L 450 301" fill="none" stroke="#b82736" stroke-width="
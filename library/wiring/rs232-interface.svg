<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="892" viewBox="0 0 1200 892" role="img" aria-labelledby="title desc"><title id="title">RS-232: put a transceiver between UART and cable</title><desc id="desc">Signal path only. Choose a transceiver and supply circuit from its datasheet; DTE/DCE roles determine the cable wiring.</desc><metadata>{&quot;creator&quot;: &quot;Kal / Valleytech Solutions&quot;, &quot;license&quot;: &quot;https://creativecommons.org/licenses/by/4.0/&quot;, &quot;sources&quot;: [{&quot;title&quot;: &quot;Analog Devices: RS-232 fundamentals&quot;, &quot;url&quot;: &quot;https://www.analog.com/en/resources/technical-articles/fundamentals-of-rs232-serial-communications.html&quot;, &quot;locator&quot;: &quot;DTE / DCE and RS-232 electrical interface&quot;, &quot;checked&quot;: &quot;2026-09-27&quot;, &quot;verification&quot;: &quot;Publisher content inspected through web retrieval; direct automated fetch unavailable&quot;}], &quot;review&quot;: &quot;Source documents inspected; independent electrical and bench review pending&quot;}</metadata><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="892" fill="#fff"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#b82736" stroke="#b82736"/><text x="50" y="59" font-size="18" fill="#b82736" font-weight="700" text-anchor="start">BLACK WIRE / WIRING &amp; PROTOCOLS</text><text x="50" y="110" font-size="33" fill="#17222e" font-weight="700" text-anchor="start">Logic UART is not RS-232</text><text x="50" y="148" font-size="20" fill="#4d5d6a" font-weight="400" text-anchor="start">A three-wire data link still requires compatible electrical conversion.</text><rect x="50" y="251" width="320" height="140" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="210.0" y="291" font-size="24" fill="#17222e" font-weight="700" text-anchor="middle">MCU</text><text x="210.0" y="323" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">Logic-level UART</text><rect x="440" y="251" width="320" height="140" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="600.0" y="291" font-size="24" fill="#17222e" font-weight="700" text-anchor="middle">Transceiver</text><text x="600.0" y="323" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">Electrical conversion</text><rect x="830" y="251" width="320" height="140" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="990.0" y="291" font-size="24" fill="#17222e" font-weight="700" text-anchor="middle">Remote port</text><text x="990.0" y="323" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">RS-232 interface</text><path d="M 370 321 L 440 321" fill="none" stroke="#007c83" stroke-width="4"/><path d="M 370 321 L 382 314 L 382 328 Z" fill="#007c83"/><path d="M 440 321 L 428 314 L 428 328 Z" fill="#007c83"/><path d="M 760 321 L 830 321" fill="none" stroke="#b82736" stroke-width="4"/><path d="M 760 321 L 772 314 L 772 328 Z" fill="#b82736"/><path d="M 830 321 L 818 314 L 818 328 Z" fill="#b82736"/><text x="70" y="441" font-size="23" fill="#17222e" font-weight="600" text-anchor="start">MCU TX</text><text x="340" y="441" font-size="22" fill="#17222e" font-weight="400" text-anchor="start">Transceiver logic input</text><text x="890" y="441" font-size="19" fill="#4d5d6a" font-weight="400" text-anchor="start">To remote RX</text><text x="70" y="509" font-size="23" fill="#17222e" font-weight="600" text-anchor="start">MCU RX</text><text x="340" y="509" font-size="22" fill="#17222e" font-weight="400" text-anchor="start">Transceiver logic output</text><text x="890" y="509" font-size="19" fill="#4d5d6a" font-weight="400" text-anchor="start">From remote TX</text><text x="70" y="577" font-size="23" fill="#17222e" font-weight="600" text-anchor="start">Signal reference</text><text x="340" y="577" font-size="22" fill="#17222e" font-weight="400" text-anchor="start">According to system design</text><text x="890" y="577" font-size="19" fill="#4d5d6a" font-weight="400" text-anchor="start">Isolation may be required</text><path d="M 50 695 L 1150 695" fill="none" stroke="#d2dae1" stroke-width="2"/><text x="50" y="729" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">Signal path only. Choose a transceiver and supply circuit from its datasheet; DTE/DCE roles determine the</text><text x="50" y="755" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">cable wiring.</text><text x="50" y="789" font-size="17" fill="#4d5d6a" font-weight="400" text-anchor="start">Original Black Wire connection diagram. Documentation reviewed; not independently bench-tested.</text><text x="50" y="836" font-size="16" fill="#b82736" font-weight="600" text-anchor="start">Kal / Valleytech Solutions  |  CC BY 4.0  |  rs232-interface  |  2026-09-27</text><text x="50" y="863" font-size="15" fill="#4d5d6a" font-weight="400" text-anchor="start">Sources: valleytech-black-wire-guide.pages.dev/wiki/wiring/rs232-interface/</text></g></svg>

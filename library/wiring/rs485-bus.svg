<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1016" viewBox="0 0 1200 1016" role="img" aria-labelledby="title desc"><title id="title">RS-485: a half-duplex multidrop bus</title><desc id="desc">Two-wire half-duplex topology with a transceiver at every node. RS-485 itself does not define Modbus addresses or a universal connector.</desc><metadata>{&quot;creator&quot;: &quot;Kal / Valleytech Solutions&quot;, &quot;license&quot;: &quot;https://creativecommons.org/licenses/by/4.0/&quot;, &quot;sources&quot;: [{&quot;title&quot;: &quot;Texas Instruments: RS-485 Design Guide, SLLA272D&quot;, &quot;url&quot;: &quot;https://www.ti.com/lit/an/slla272d/slla272d.pdf&quot;, &quot;locator&quot;: &quot;Sections on topology, termination, failsafe and grounding&quot;, &quot;checked&quot;: &quot;2026-09-27&quot;, &quot;sha256&quot;: &quot;b613117a93a95ff14444710f7d21aa67f70a3e77f6ddd8d4fcda8666477417db&quot;, &quot;bytes&quot;: 666510, &quot;format&quot;: &quot;PDF&quot;, &quot;verification&quot;: &quot;Publisher content inspected&quot;}, {&quot;title&quot;: &quot;Analog Devices: AN-960 RS-485/RS-422 implementation&quot;, &quot;url&quot;: &quot;https://www.analog.com/en/resources/app-notes/an-960.html&quot;, &quot;locator&quot;: &quot;Driver enable and half-duplex bus connections&quot;, &quot;checked&quot;: &quot;2026-09-27&quot;, &quot;verification&quot;: &quot;Publisher content inspected through web retrieval; direct automated fetch unavailable&quot;}], &quot;review&quot;: &quot;Source documents inspected; independent electrical and bench review pending&quot;}</metadata><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="1016" fill="#fff"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#b82736" stroke="#b82736"/><text x="50" y="59" font-size="18" fill="#b82736" font-weight="700" text-anchor="start">BLACK WIRE / WIRING &amp; PROTOCOLS</text><text x="50" y="110" font-size="33" fill="#17222e" font-weight="700" text-anchor="start">Terminate the cable ends</text><text x="50" y="148" font-size="20" fill="#4d5d6a" font-weight="400" text-anchor="start">Identical transceivers shown. Check polarity truth tables when mixing manufacturers.</text><path d="M 120 366 L 1080 366" fill="none" stroke="#007c83" stroke-width="4"/><path d="M 120 471 L 1080 471" fill="none" stroke="#946500" stroke-width="4"/><rect x="180" y="211" width="210" height="100" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="285.0" y="251" font-size="24" fill="#17222e" font-weight="700" text-anchor="middle">Node A</text><text x="285.0" y="283" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">RS-485 transceiver</text><path d="M 245 311 L 245 366" fill="none" stroke="#007c83" stroke-width="4"/><circle cx="245" cy="366" r="6" fill="#007c83"/><path d="M 315 311 L 315 471" fill="none" stroke="#946500" stroke-width="4"/><circle cx="315" cy="471" r="6" fill="#946500"/><rect x="495" y="211" width="210" height="100" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="600.0" y="251" font-size="24" fill="#17222e" font-weight="700" text-anchor="middle">Node B</text><text x="600.0" y="283" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">RS-485 transceiver</text><path d="M 560 311 L 560 366" fill="none" stroke="#007c83" stroke-width="4"/><circle cx="560" cy="366" r="6" fill="#007c83"/><path d="M 630 311 L 630 471" fill="none" stroke="#946500" stroke-width="4"/><circle cx="630" cy="471" r="6" fill="#946500"/><rect x="810" y="211" width="210" height="100" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="915.0" y="251" font-size="24" fill="#17222e" font-weight="700" text-anchor="middle">Node C</text><text x="915.0" y="283" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">RS-485 transceiver</text><path d="M 875 311 L 875 366" fill="none" stroke="#007c83" stroke-width="4"/><circle cx="875" cy="366" r="6" fill="#007c83"/><path d="M 945 311 L 945 471" fill="none" stroke="#946500" stroke-width="4"/><circle cx="945" cy="471" r="6" fill="#946500"/><path d="M 120 366 L 120 396" fill="none" stroke="#4d5d6a" stroke-width="4"/><rect x="108" y="396" width="24" height="45" rx="0" fill="#fff" stroke="#4d5d6a"/><path d="M 120 441 L 120 471" fill="none" stroke="#4d5d6a" stroke-width="4"/><text x="120" y="513" font-size="19" fill="#17222e" font-weight="600" text-anchor="middle">Match Z0</text><path d="M 1080 366 L 1080 396" fill="none" stroke="#4d5d6a" stroke-width="4"/><rect x="1068" y="396" width="24" height="45" rx="0" fill="#fff" stroke="#4d5d6a"/><path d="M 1080 441 L 1080 471" fill="none" stroke="#4d5d6a" stroke-width="4"/><text x="1080" y="513" font-size="19" fill="#17222e" font-weight="600" text-anchor="middle">Match Z0</text><text x="420" y="350" font-size="24" fill="#007c83" font-weight="700" text-anchor="middle">Line A *</text><text x="600" y="507" font-size="24" fill="#946500" font-weight="700" text-anchor="middle">Line B *</text><text x="50" y="576" font-size="22" fill="#4d5d6a" font-weight="400" text-anchor="start">* Same part and polarity at every node in this example. Mixed A/B naming must be resolved</text><text x="50" y="606" font-size="22" fill="#4d5d6a" font-weight="400" text-anchor="start">from truth tables.</text><text x="50" y="676" font-size="21" fill="#4d5d6a" font-weight="400" text-anchor="start">Signal reference / isolation and power are not drawn. Design them for the actual ground</text><text x="50" y="705" font-size="21" fill="#4d5d6a" font-weight="400" text-anchor="start">offsets and transceiver limits.</text><text x="50" y="761" font-size="19" fill="#4d5d6a" font-weight="400" text-anchor="start">Dot = electrical connection. Crossing lines without a dot are not connected.</text><path d="M 50 819 L 1150 819" fill="none" stroke="#d2dae1" stroke-width="2"/><text x="50" y="853" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">Two-wire half-duplex topology with a transceiver at every node. RS-485 itself does not define Modbus</text><text x="50" y="879" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">addresses or a universal connector.</text><text x="50" y="913" font-size="17" fill="#4d5d6a" font-weight="400" text-anchor="start">Original Black Wire connection diagram. Documentation reviewed; not independently bench-tested.</text><text x="50" y="960" font-size="16" fill="#b82736" font-weight="600" text-anchor="start">Kal / Valleytech Solutions  |  CC BY 4.0  |  rs485-bus  |  2026-09-27</text><text x="50" y="987" font-size="15" fill="#4d5d6a" font-weight="400" text-anchor="start">Sources: valleytech-black-wire-guide.pages.dev/wiki/wiring/rs485-bus/</text></g></svg>

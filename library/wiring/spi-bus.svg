<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc"><title id="title">SPI: clock, data direction and chip select</title><desc id="desc">Conventional four-wire, active-low-CS SPI. Three-wire, daisy-chain and device-specific interfaces need their own diagrams.</desc><metadata>{&quot;creator&quot;: &quot;Kal / Valleytech Solutions&quot;, &quot;license&quot;: &quot;https://creativecommons.org/licenses/by/4.0/&quot;, &quot;sources&quot;: [{&quot;title&quot;: &quot;Analog Devices: Introduction to SPI Interface&quot;, &quot;url&quot;: &quot;https://www.analog.com/en/resources/analog-dialogue/articles/introduction-to-spi-interface.html&quot;, &quot;locator&quot;: &quot;Interface, signal direction and CPOL/CPHA table&quot;, &quot;checked&quot;: &quot;2026-09-27&quot;, &quot;verification&quot;: &quot;Publisher content inspected through web retrieval; direct automated fetch unavailable&quot;}], &quot;review&quot;: &quot;Source documents inspected; independent electrical and bench review pending&quot;}</metadata><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="895" fill="#fff"/><rect x="0" y="0" width="1200" height="14" rx="0" fill="#b82736" stroke="#b82736"/><text x="50" y="59" font-size="18" fill="#b82736" font-weight="700" text-anchor="start">BLACK WIRE / WIRING &amp; PROTOCOLS</text><text x="50" y="110" font-size="33" fill="#17222e" font-weight="700" text-anchor="start">Follow direction, not just the abbreviation</text><text x="50" y="148" font-size="20" fill="#4d5d6a" font-weight="400" text-anchor="start">MOSI = host out; MISO = host in. Each ordinary peripheral gets its own CS.</text><rect x="50" y="211" width="345" height="60" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="222.5" y="251" font-size="24" fill="#17222e" font-weight="700" text-anchor="middle">Host MCU</text><rect x="805" y="211" width="345" height="60" rx="12" fill="#f1f5f7" stroke="#d2dae1"/><text x="977.
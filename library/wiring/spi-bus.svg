<rect x="50" y="503" width="345" height="57" rx="12" fill="#f7f9fb" stroke="#d2dae1"/><text x="70" y="538" font-size="23" fill="#17222e" font-weight="600" text-anchor="start">CS output</text><rect x="805" y="503" width="345" height="57" rx="12" fill="#f7f9fb" stroke="#d2dae1"/><text x="825" y="538" font-size="23" fill="#17222e" font-weight="600" text-anchor="start">/CS input</text><text x="600" y="517" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">Active low</text><path d="M 410 540 L 790 540" fill="none" stroke="#007c83" stroke-width="4"/><path d="M 790 540 L 778 533 L 778 547 Z" fill="#007c83"/><rect x="50" y="578" width="345" height="57" rx="12" fill="#f7f9fb" stroke="#d2dae1"/><text x="70" y="613" font-size="23" fill="#17222e" font-weight="600" text-anchor="start">GND</text><rect x="805" y="578" width="345" height="57" rx="12" fill="#f7f9fb" stroke="#d2dae1"/><text x="825" y="613" font-size="23" fill="#17222e" font-weight="600" text-anchor="start">GND</text><text x="600" y="592" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="middle">Signal reference</text><path d="M 410 615 L 790 615" fill="none" stroke="#4d5d6a" stroke-width="4"/><path d="M 50 698 L 1150 698" fill="none" stroke="#d2dae1" stroke-width="2"/><text x="50" y="732" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">Conventional four-wire, active-low-CS SPI. Three-wire, daisy-chain and device-specific interfaces need</text><text x="50" y="758" font-size="18" fill="#4d5d6a" font-weight="400" text-anchor="start">their own diagrams.</text><text x="50" y="792" font-size="17" fill="#4d5d6a" font-weight="400" text-anchor="start">Original Black Wire connection diagram. Documentation reviewed; not independently bench-tested.</text><text x="50" y="839" font-size="16" fill="#b82736" font-weight="600" text-anchor="start">Kal / Valleytech Solutions  |  CC BY 4.0  |  spi-bus  |  2026-09-27</text><text x="50" y="866" font-size="15" fill="#4d5d6a" font-weight="40